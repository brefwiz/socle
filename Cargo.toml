[package]
name = "socle"
version = "4.4.0"
edition = "2024"
authors = ["Gregoire Salingue"]
description = "Opinionated axum service bootstrap: telemetry, database, rate limiting, and shutdown in one builder"
license = "MIT"
repository = "https://github.com/brefwiz/socle"
readme = "README.md"
keywords = ["axum", "tower", "bootstrap", "http", "telemetry"]
categories = ["web-programming::http-server", "asynchronous"]
rust-version = "1.98"

[package.metadata.docs.rs]
# utoipa-swagger-ui downloads assets at build time — blocked by docs.rs sandbox.
# Build docs without the openapi feature to avoid that network dependency.
features = ["telemetry", "database", "ratelimit-memory", "dotenv", "validation", "cursor", "testing"]
no-default-features = true

[features]
default = ["telemetry", "database", "ratelimit-memory", "openapi", "dotenv", "rfc-types"]

dotenv = ["dep:dotenvy"]

# Enforce RFC-oriented api-bones response types at compile time.
# When enabled (the default), handler success responses must be constructed
# via the socle builder functions (ok, created, created_at, created_under,
# listed, listed_page, etagged).  Direct tuple construction of Ok arms is
# rejected by the compiler.  Disable only during a migration window; document
# the reason.  Use UnconstrainedResponse for per-handler opt-outs instead.
rfc-types = []

telemetry = []

database = ["dep:sqlx"]

ratelimit = []
ratelimit-memory = ["ratelimit", "dep:governor"]

nats = ["dep:async-nats", "dep:metrics-api"]
test-util = []

openapi = ["dep:utoipa", "dep:utoipa-swagger-ui"]

validation = ["dep:validator"]

cursor = ["api-bones/base64"]

# Backend-for-Frontend session layer: opaque session store, envelope crypto,
# and the operator-managed KEK source. Pulls only permissive, crates.io deps.
bff = ["dep:async-trait", "dep:sqlx", "dep:aes-gcm", "dep:hkdf", "dep:sha2", "dep:zeroize"]

# Exposes the in-process test KEK source in non-test builds so integration
# tests (and downstream harnesses) can exercise the envelope crypto without a
# KMS. Never enable in production — it is a test double, not a key custodian.
test-crypto = []

testing = ["dep:reqwest"]
http-client = ["dep:reqwest", "dep:reqwest-middleware", "dep:opentelemetry", "dep:async-trait", "dep:http"]
metrics = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-prometheus", "dep:prometheus"]
testing-postgres = ["dep:testcontainers", "dep:testcontainers-modules", "dep:sqlx"]

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["trace", "cors", "catch-panic", "compression-full", "request-id", "util", "limit"] }
uuid = { version = "1", features = ["v7", "v5"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
figment = { version = "0.10", features = ["env", "toml"] }
chrono = { version = "0.4", features = ["serde"] }

api-bones = { version = "6", features = ["axum", "uuid"] }

# TLS backend: aws-lc-rs, not ring. sqlx-core gates its aws-lc-rs arm on
# `not(_tls-rustls-ring-webpki)`, so naming ring here silently won for every
# downstream service, whatever backend that service selected itself.
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "migrate", "macros", "chrono"], optional = true }

governor = { version = "0.10", default-features = false, features = ["std", "dashmap"], optional = true }

utoipa = { version = "5", optional = true }
utoipa-swagger-ui = { version = "9", default-features = false, features = ["axum", "vendored"], optional = true }

dotenvy = { version = "0.15", optional = true }

reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"], optional = true }
reqwest-middleware = { version = "0.5", optional = true }
opentelemetry = { version = "0.32", optional = true }
async-trait = { version = "0.1", optional = true }
aes-gcm = { version = "0.11", optional = true }
hkdf = { version = "0.13", optional = true }
sha2 = { version = "0.11", optional = true }
zeroize = { version = "1", optional = true, features = ["derive"] }
http = { version = "1", optional = true }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["metrics"], optional = true }
opentelemetry-prometheus = { version = "0.33", optional = true }
prometheus = { version = "0.14", default-features = false, optional = true }

validator = { version = "0.20", features = ["derive"], optional = true }

testcontainers = { version = "0.27", optional = true }
testcontainers-modules = { version = "0.15", features = ["postgres"], optional = true }

# default-features = false with `aws-lc-rs` substituted for the `ring` in
# async-nats's default set; that one feature turns on tokio-rustls/ring,
# tokio-websockets/ring and rustls-webpki/ring, re-enabling rustls's ring arm
# graph-wide. Every other default feature is preserved verbatim.
async-nats = { version = "0.50", default-features = false, features = [
    "server_2_10",
    "server_2_11",
    "server_2_12",
    "server_2_14",
    "service",
    "aws-lc-rs",
    "jetstream",
    "nkeys",
    "crypto",
    "object-store",
    "kv",
    "websockets",
    "nuid",
], optional = true }
metrics-api = { package = "metrics", version = "0.23", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde_json = "1"
http-body-util = "0.1"
bytes = "1"
tempfile = "3"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "chrono"] }
opentelemetry_sdk = { version = "0.32", features = ["trace"] }
rand = "0.10"

[[example]]
name = "minimal"
path = "examples/minimal.rs"
required-features = ["telemetry"]

[[example]]
name = "with_database"
path = "examples/with_database.rs"
required-features = ["telemetry", "database"]

[[example]]
name = "with_ratelimit"
path = "examples/with_ratelimit.rs"
required-features = ["telemetry", "ratelimit-memory"]

[[example]]
name = "bff_session"
path = "examples/bff_session.rs"
required-features = ["bff"]

[[test]]
name = "integration"
path = "tests/integration.rs"
required-features = ["testing"]

[[test]]
name = "org_isolation"
path = "tests/org_isolation.rs"

[[test]]
name = "org_policy"
path = "tests/org_policy.rs"

[[test]]
name = "audit_filter"
path = "tests/audit_filter.rs"

[[test]]
name = "audit_layer"
path = "tests/audit_layer.rs"
required-features = ["test-util"]

[[test]]
name = "audit_sinks"
path = "tests/audit_sinks.rs"
required-features = ["test-util"]

[[test]]
name = "session_ports_no_transport_dep"
path = "tests/session_ports_no_transport_dep.rs"
required-features = ["bff"]

[[test]]
name = "envelope_crypto_roundtrip"
path = "tests/envelope_crypto_roundtrip.rs"
required-features = ["bff", "test-crypto"]

[[test]]
name = "postgres_session_store"
path = "tests/postgres_session_store.rs"
required-features = ["bff", "testing-postgres"]

[[test]]
name = "bff_session_migrator"
path = "tests/bff_session_migrator.rs"
required-features = ["bff", "testing-postgres"]

[lints.rust]
warnings    = "deny"
unsafe_code = "deny"

[lints.clippy]
all      = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
